<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZD5T4V35R5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoulFam · SoulFa 靈魂沙發</title>
  <link rel="icon" type="image/png" href="網頁分頁logo.png" />
  <link rel="stylesheet" href="https://use.typekit.net/wdm8jyp.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">

  <style>
    body.orange {
      background:
        linear-gradient(rgba(239,236,229,0.52), rgba(239,236,229,0.52)),
        url('圖片/海報底.png') center / cover no-repeat fixed;
      color: #2C2420;
    }
    body.orange::before { display: none; }

    body.orange nav.top .brand,
    body.orange nav.top ul a,
    body.orange nav.top .nav-toggle { color: #2C2420; }
    body.orange nav.top ul a:hover {
      color: #7A3A1C;
      font-variation-settings: 'wdth' 125, 'SEED' 12;
      letter-spacing: 0.24em;
    }
    body.orange nav.top.scrolled {
      background: rgba(228,222,210,0.90);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(44,36,32,0.14);
    }

    /* ── Auth card ── */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }
    .auth-card {
      background: rgba(239,236,229,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(44,36,32,0.10);
      border-radius: 2px;
      padding: 56px 60px 64px;
      width: 100%;
      max-width: 620px;
    }
    .auth-desc {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: 13px;
      color: rgba(44,36,32,0.55);
      line-height: 1.65;
      margin: 0 0 24px;
      text-align: center;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-row .form-group { flex: 1; }
    .auth-title {
      font-family: var(--font-juana);
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 600;
      color: #2C2420;
      margin: 0 0 28px;
      line-height: 1;
      text-align: center;
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 36px;
      border-bottom: 1px solid rgba(44,36,32,0.14);
    }
    .auth-tab {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(44,36,32,0.42);
      padding: 0 20px 14px;
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .auth-tab.active {
      color: #2C2420;
      border-bottom-color: #C77B4A;
    }

    /* ── Form ── */
    .auth-form { display: none; flex-direction: column; gap: 20px; }
    .auth-form.active { display: flex; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(44,36,32,0.52);
    }
    .form-input {
      background: rgba(255,255,255,0.70);
      border: 1px solid rgba(44,36,32,0.45);
      border-radius: 2px;
      padding: 15px 16px;
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: 14px;
      color: #2C2420;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      width: 100%;
      box-sizing: border-box;
    }
    .form-input:focus {
      border-color: #C77B4A;
      background: rgba(255,255,255,0.90);
    }
    .form-input::placeholder { color: rgba(44,36,32,0.28); }

    .auth-btn {
      margin-top: 4px;
      padding: 18px 0;
      width: 100%;
      background: #2C2420;
      color: rgba(239,236,229,0.92);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .auth-btn:hover { background: #7A3A1C; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-msg {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      padding: 10px 12px;
      border-radius: 2px;
      display: none;
    }
    .auth-msg.success {
      display: block;
      background: rgba(100,160,100,0.12);
      color: #3A6A3A;
      border: 1px solid rgba(100,160,100,0.28);
    }
    .auth-msg.error {
      display: block;
      background: rgba(180,60,40,0.10);
      color: #8A2A18;
      border: 1px solid rgba(180,60,40,0.22);
    }

    .auth-divider {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: rgba(44,36,32,0.28);
      margin: 4px 0;
    }

    @media (max-width: 520px) {
      .auth-card { padding: 40px 28px 48px; }
      .form-row { flex-direction: column; gap: 20px; }
    }
  </style>
</head>
<body class="orange">

<div class="page-transition"></div>

<nav class="top" id="topnav">
  <a class="brand" href="index.html">SOULFA</a>
  <button class="nav-toggle" id="nav-toggle" aria-label="選單" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul>
    <li><a href="music.html">Music</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="tour.html">Tour</a></li>
    <li><a href="merch.html">Merch</a></li>
    <li><a href="about.html">About</a></li>
    <li id="nav-soulfam" style="display:none"><a href="members.html">SoulFam</a></li>
  </ul>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title" id="auth-title">加入 SoulFam</h1>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登入</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">註冊</button>
    </div>

    <div id="msg" class="auth-msg"></div>

    <!-- Login form -->
    <form class="auth-form active" id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-email">Email</label>
        <input class="form-input" id="login-email" type="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">密碼</label>
        <input class="form-input" id="login-password" type="password" placeholder="••••••••" required />
      </div>
      <button class="auth-btn" type="submit" id="login-btn">登入</button>
      <p class="auth-divider">忘記密碼？<a href="#" onclick="handleReset(event)" style="color:#C77B4A;text-decoration:none;">重設密碼</a></p>
    </form>

    <!-- Signup form -->
    <form class="auth-form" id="form-signup" onsubmit="handleSignup(event)">
      <p class="auth-desc">成為 SoulFam 的一員，獲得我們的最新消息與更多會員專屬內容！</p>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signup-firstname">First Name</label>
          <input class="form-input" id="signup-firstname" type="text" placeholder="名字" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-lastname">Last Name</label>
          <input class="form-input" id="signup-lastname" type="text" placeholder="姓氏" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-email">Email</label>
        <input class="form-input" id="signup-email" type="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-password">密碼</label>
        <input class="form-input" id="signup-password" type="password" placeholder="至少 6 個字元" minlength="6" required />
      </div>
      <button class="auth-btn" type="submit" id="signup-btn">Sign Up</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="transitions.js"></script>
<script>
(function () {
  var SUPA_URL = 'https://gihuakujyczqlcsqbqqq.supabase.co';
  var SUPA_KEY = 'sb_publishable_6YO5EV6oCaTkGWdBA9MZDQ_0rzEPSv8';
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  /* If already logged in, go to members page */
  sb.auth.getSession().then(function (res) {
    if (res.data.session) window.location.href = 'members.html';
  });

  window.switchTab = function (tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('auth-title').textContent = tab === 'signup' ? 'Sign Up' : '加入 SoulFam';
    showMsg('', '');
  };

  /* Auto-switch to signup tab if URL hash is #signup */
  if (window.location.hash === '#signup') window.switchTab('signup');

  function showMsg(type, text) {
    var el = document.getElementById('msg');
    el.className = 'auth-msg' + (type ? ' ' + type : '');
    el.textContent = text;
  }

  window.handleLogin = function (e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '登入中…';
    var email = document.getElementById('login-email').value;
    var pass  = document.getElementById('login-password').value;
    sb.auth.signInWithPassword({ email: email, password: pass }).then(function (res) {
      if (res.error) {
        showMsg('error', '登入失敗：' + (res.error.message === 'Invalid login credentials' ? 'Email 或密碼錯誤' : res.error.message));
        btn.disabled = false; btn.textContent = '登入';
      } else {
        window.location.href = 'members.html';
      }
    });
  };

  window.handleSignup = function (e) {
    e.preventDefault();
    var btn = document.getElementById('signup-btn');
    btn.disabled = true; btn.textContent = '建立中…';
    var email     = document.getElementById('signup-email').value;
    var pass      = document.getElementById('signup-password').value;
    var firstName = document.getElementById('signup-firstname').value;
    var lastName  = document.getElementById('signup-lastname').value;
    sb.auth.signUp({ email: email, password: pass, options: { data: { first_name: firstName, last_name: lastName } } }).then(function (res) {
      if (res.error) {
        showMsg('error', '註冊失敗：' + res.error.message);
        btn.disabled = false; btn.textContent = '建立帳號';
      } else {
        showMsg('success', '驗證信已寄出！請到 Email 點擊確認連結後再登入。');
        btn.disabled = false; btn.textContent = '建立帳號';
      }
    });
  };

  window.handleReset = function (e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value;
    if (!email) { showMsg('error', '請先輸入 Email'); return; }
    sb.auth.resetPasswordForEmail(email, { redirectTo: 'https://www.soulfaofficial.com/auth.html' })
      .then(function (res) {
        if (res.error) showMsg('error', '發送失敗：' + res.error.message);
        else showMsg('success', '重設密碼連結已寄出，請查看 Email。');
      });
  };

  /* Nav */
  var nav = document.getElementById('topnav');
  function navTick() { nav.classList.toggle('scrolled', window.scrollY > 60); }
  window.addEventListener('scroll', navTick, { passive: true });
  navTick();

  /* Hamburger */
  var btn = document.getElementById('nav-toggle');
  if (btn) btn.addEventListener('click', function () { btn.setAttribute('aria-expanded', nav.classList.toggle('open')); });
})();
</script>
<script>
(function(){
  var key="sb-gihuakujyczqlcsqbqqq-auth-token";
  try{
    var s=localStorage.getItem(key);
    if(s){
      var d=JSON.parse(s);
      if(d && d.access_token){
        var el=document.getElementById("nav-soulfam");
        if(el) el.style.display="";
      }
    }
  }catch(e){}
})();
</script>
</body>
</html>
